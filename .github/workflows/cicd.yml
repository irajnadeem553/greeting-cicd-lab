
name: Activity 3 CI-CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install pytest

      - name: Test Greeting Application
        run: pytest -v test_greeting.py

      - name: Test Student Grading System
        run: pytest -v test_grading.py

  build:
    name: Build Applications
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Greeting Application
        run: python -m py_compile greeting.py
        
      - name: Build Student Grading System
        run: python -m py_compile grading.py

  deploy:
    name: Simulated Deployment
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy Application
        run: echo "Applications deployed successfully!"
